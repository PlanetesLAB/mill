[project]
name = "mills"
version = "0.1.0"
description = "Statistics and machine learning tutorials for planet formation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1,<3",
    "scipy>=1.14,<2",
    "matplotlib>=3.9,<4",
    "matplotidlib",
    "nbformat>=5.10,<6",
    "nbclient>=0.10,<1",
    "nbconvert>=7.16,<8",
    "ipykernel>=6.29,<8",
    "jupyterlab>=4.3,<5",
]

[tool.uv]
package = false

[tool.uv.sources]
matplotidlib = { git = "https://github.com/PlanetesLAB/matplotidlib.git", rev = "5f270997c90a1912f6c1d9efdaab916dfa5b9ee5" }
